name: Export database

# Publishes the database as a SQLite file to the public R2 bucket:
#   https://blob.localscore.ai/db/localscore-latest.sqlite.gz
#   https://blob.localscore.ai/db/localscore-YYYY-MM-DD.sqlite.gz
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-db
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Export
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          # A read-only token: this job never writes to the database.
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node scripts/export-db.mjs localscore.sqlite
          gzip -9 -n localscore.sqlite

      - name: Upload to R2
        # R2's S3 API with keys limited to the localscore bucket.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          dated="localscore-$(date -u +%F).sqlite.gz"
          put() {
            aws s3 cp localscore.sqlite.gz "s3://localscore/db/$1" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/gzip \
              --content-disposition "attachment; filename=\"$1\"" \
              --cache-control "$2"
          }
          put "$dated" "public, max-age=31536000, immutable"
          put localscore-latest.sqlite.gz "public, max-age=3600"
          echo "Published https://blob.localscore.ai/db/$dated" >> "$GITHUB_STEP_SUMMARY"
